[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtuber_analysis"
version = "1.0.0"
description = "Do financial YouTubers' stock calls come true? Data pipeline and datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.149",
    "google-genai>=1.55",
    "isodate>=0.7",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "vaderSentiment>=3.3",
    "yfinance>=0.2.49",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
